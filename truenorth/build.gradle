plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = "21.8.47"                 // NeoForge for MC 1.21.8
    validateAccessTransformers = true   // fine even if your AT file is empty

    runs {
        client { client() }
        server { server() }
    }
    mods {
        truenorth { sourceSet sourceSets.main }
    }
}
group = "com.grickaby.truenorth"
version = "0.7.1"

base {
    archivesName = "TrueNorth"
}

tasks.jar {
    archiveClassifier = "NF"
}

tasks.register('rebuild') {
    dependsOn 'clean', 'build'
}
